name: Android APK (standalone)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run source checks
        env:
          CI: '1'
        run: |
          pnpm check
          pnpm test
          pnpm lint
          # Expo reports patch-level compatibility drift as a non-zero check
          # even when the frozen lockfile is valid. Keep it visible without
          # blocking the actual source checks or APK build.
          pnpm exec expo install --check || echo "::warning::Expo reports package compatibility updates; the locked versions are used for this build."

      - name: Generate the Android native project
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Use stable Android renderer
        run: |
          # The app uses no custom Fabric/TurboModule code. Paper avoids
          # startup ANRs on devices where the experimental renderer stalls
          # before React can dismiss the native splash screen.
          sed -i 's/^newArchEnabled=true$/newArchEnabled=false/' android/gradle.properties
          grep -q '^newArchEnabled=false$' android/gradle.properties

      - name: Assemble installable standalone APK
        run: |
          cd android
          # Debug variants expect a Metro server and omit the JS bundle.
          # Release is still signed with the debug keystore by build.gradle,
          # so this remains side-loadable while working fully offline.
          ./gradlew :app:assembleRelease --no-daemon
          apk_path=app/build/outputs/apk/release/app-release.apk
          test -s "$apk_path"
          unzip -Z1 "$apk_path" | grep -Eq 'assets/.*(bundle|hbc)' || {
            echo "The standalone APK is missing its embedded JavaScript bundle."
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reactide-android-debug-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
