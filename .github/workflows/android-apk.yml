name: Android APK (debug)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run source checks
        env:
          CI: '1'
        run: |
          pnpm check
          pnpm test
          pnpm lint
          # Expo reports patch-level compatibility drift as a non-zero check
          # even when the frozen lockfile is valid. Keep it visible without
          # blocking the actual source checks or APK build.
          pnpm exec expo install --check || echo "::warning::Expo reports package compatibility updates; the locked versions are used for this build."

      - name: Generate the Android native project
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Assemble installable debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reactide-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
