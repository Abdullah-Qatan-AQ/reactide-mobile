plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'space.manus.reactide'
version = '1.0.0'

android {
  namespace 'expo.modules.termuxruntime'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    minSdkVersion 24
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
